<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeUp 微润色确认</title>
    <style>
      :root {
        color: #10213a;
        background: #f5f8fc;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.12), transparent 42%),
          linear-gradient(180deg, #ffffff 0%, #eef4fb 100%);
      }

      .shell {
        min-height: 100vh;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .logo {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #ffffff;
        box-shadow: 0 10px 24px rgba(15, 35, 67, 0.12);
        color: #2563eb;
        font-weight: 900;
        font-size: 23px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
      }

      .hint {
        margin: 4px 0 0;
        color: #5f718c;
        font-size: 12px;
      }

      .icon-button {
        width: 34px;
        height: 34px;
        border: 1px solid #d5e0ef;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.84);
        color: #536983;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }

      main {
        display: grid;
        gap: 12px;
        min-height: 0;
        flex: 1;
      }

      section {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        color: #5f718c;
        font-size: 12px;
        font-weight: 700;
      }

      .text-box {
        width: 100%;
        min-height: 88px;
        max-height: 128px;
        overflow: auto;
        padding: 12px;
        border: 1px solid #d8e3f0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        color: #12233b;
        font-size: 14px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }

      textarea.text-box {
        resize: none;
        outline: none;
        font: inherit;
      }

      textarea.text-box:focus {
        border-color: #8fb4ff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding-top: 2px;
      }

      button {
        height: 38px;
        border-radius: 8px;
        border: 1px solid #cfdceb;
        padding: 0 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .secondary {
        color: #50617a;
        background: rgba(255, 255, 255, 0.86);
      }

      .primary {
        color: #ffffff;
        background: #2563eb;
        border-color: #2563eb;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.22);
      }

      .primary:disabled,
      .secondary:disabled,
      .icon-button:disabled {
        cursor: default;
        opacity: 0.64;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">
          <div class="logo">T</div>
          <div>
            <h1>微润色确认</h1>
            <p class="hint" id="hint">检查 AI 整理后的文字，再决定是否输出。</p>
          </div>
        </div>
        <button class="icon-button" id="close" title="取消输出" aria-label="取消输出">×</button>
      </header>

      <main>
        <section>
          <label for="original">识别原文</label>
          <div class="text-box" id="original"></div>
        </section>
        <section>
          <label for="polished">润色结果</label>
          <textarea class="text-box" id="polished" spellcheck="false"></textarea>
        </section>
      </main>

      <footer>
        <button class="secondary" id="cancel">取消</button>
        <button class="primary" id="accept">输出</button>
      </footer>
    </div>

    <script>
      const originalEl = document.getElementById("original");
      const polishedEl = document.getElementById("polished");
      const acceptEl = document.getElementById("accept");
      const cancelEl = document.getElementById("cancel");
      const closeEl = document.getElementById("close");

      async function init() {
        const payload = await window.typeupPolish.getPayload();
        originalEl.textContent = payload?.original || "";
        polishedEl.value = payload?.polished || "";
        polishedEl.focus();
        polishedEl.setSelectionRange(polishedEl.value.length, polishedEl.value.length);
      }

      function accept() {
        acceptEl.disabled = true;
        cancelEl.disabled = true;
        closeEl.disabled = true;
        document.getElementById("hint").textContent = "正在切回目标窗口并输出...";
        window.typeupPolish.accept(polishedEl.value);
      }

      function cancel() {
        window.typeupPolish.cancel();
      }

      acceptEl.addEventListener("click", accept);
      cancelEl.addEventListener("click", cancel);
      closeEl.addEventListener("click", cancel);
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") cancel();
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") accept();
      });

      init().catch(cancel);
    </script>
  </body>
</html>
